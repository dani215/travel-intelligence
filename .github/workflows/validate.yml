name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    name: Structural package validation (not behavioral evaluation)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Plugins package structure and selected field types
        run: python scripts/validate_plugin.py .
